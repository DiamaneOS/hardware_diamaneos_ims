#
# The default application key, as the platform keys.conf defines @RELEASE.
# The platform file is not an input of system_ext_mac_permissions.xml, hence
# this tag of our own (a second @RELEASE would clash in
# plat_mac_permissions.xml, which reads this file too). At release signing,
# sign_target_files_apks maps testkey to releasekey and rewrites the
# certificate in every *mac_permissions.xml.
[@DIAMANEOS_RELEASE]
ALL : $DEFAULT_SYSTEM_DEV_CERTIFICATE/testkey.x509.pem
